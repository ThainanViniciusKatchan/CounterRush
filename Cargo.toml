[workspace]
resolver = "2"
members = [
    "core",
    "windows_api",
    "tweaks",
    "config",
    "ui",
]

[workspace.package]
version      = "0.24.4"
edition      = "2021"
rust-version = "1.88"
description = "CounterRush"
repository = "https://github.com/ThainanViniciusKatchan/DesktopORZ"
authors = ["ThainanViniciusKatchan"]
license      = "GPL-3.0"

[workspace.dependencies]
# Dependências compartilhadas entre os crates.
# Adicionar apenas quando um módulo realmente precisar.
thiserror = "1.0"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml      = "0.8"
sysinfo   = "0.30"
tempfile  = "3"
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "native-certs", "github", "archive-zip", "compression-zip-deflate", "archive-tar", "compression-tar-gz", "checksums"] }
self-replace = "1"
sha2      = "0.10"

[profile.release]
opt-level = "z"
lto       = true
strip     = true
panic     = "abort"